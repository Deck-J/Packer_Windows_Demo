# Basic, runnable version of the Enterprise Build workflow. Same shape - restore, build, test, pack, publish - but
# against example/Enterprise.Product.sln, which actually exists in this repo, so the pipeline can be proven end to end
# before it is pointed at the real product solution.
#
# Differences from the enterprise one, and why:
#   * no MSBuild+devenv fallback: this solution is SDK-style and builds cleanly with dotnet build. Add the fallback only
#     when a legacy .vcxproj/.csproj actually needs it - dead fallback paths are untested paths.
#   * packages use GitHub Packages instead of Nexus: one less service to run, no extra secrets to manage, and the
#     auth is the workflow's own GITHUB_TOKEN. Needs `packages: write` and the repo setting "Workflow permissions ->
#     Read and write" if the org default is read-only.
#   * tests run with `dotnet test` because these are SDK-style net9.0 projects (the enterprise note about needing
#     vstest.console applies to .NET Framework test assemblies, not these).
name: Example Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write     # push packages to GitHub Packages

concurrency:
  group: example-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    defaults:
      run:
        working-directory: example
    env:
      CONFIGURATION: Release
      SOLUTION: Enterprise.Product.sln
      GH_ACTOR: ${{ github.actor }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Show toolchain
        run: dotnet --info

      - name: Configure GitHub Packages
        shell: pwsh
        env:
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="github" value="https://nuget.pkg.github.com/$env:GH_OWNER/index.json" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <github>
                <add key="Username" value="$env:GH_ACTOR" />
                <add key="ClearTextPassword" value="$env:GH_TOKEN" />
              </github>
            </packageSourceCredentials>
          </configuration>
          "@ | Set-Content -Path nuget.config -Encoding UTF8
          dotnet nuget list source
      - name: Restore
        run: dotnet restore $env:SOLUTION

      - name: Build
        run: dotnet build $env:SOLUTION --configuration $env:CONFIGURATION --no-restore

      - name: Test
        run: dotnet test $env:SOLUTION --configuration $env:CONFIGURATION --no-build --logger "trx;LogFileName=results.trx"

      - name: Pack
        run: dotnet pack src\Enterprise.Product.Core\Enterprise.Product.Core.csproj --configuration $env:CONFIGURATION --no-build --output artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-build-output
          path: |
            example/artifacts/**
            example/tests/**/TestResults/**
          if-no-files-found: warn

      - name: Publish to GitHub Packages (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          Get-ChildItem artifacts\*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --source github --api-key "$env:GH_TOKEN" --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "push failed for $($_.Name)" }
          }
