name: Bootstrap Terraform state

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: true
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_region: us-central1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Initialize bootstrap Terraform
        working-directory: bootstrap
        run: terraform init

      - name: Create encrypted state bucket
        working-directory: bootstrap
        run: |
          terraform fmt -check
          terraform validate
          terraform apply -auto-approve \
            -var='state_access_members=["serviceAccount:${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}"]'