name: Build Windows golden image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.hcl"
      - "app/**"
      - "scripts/**"
      - ".github/workflows/build-image.yml"

permissions:
  contents: write
  id-token: write

concurrency:
  group: windows-golden-image
  cancel-in-progress: false

env:
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_terraform_executor_service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
  TF_VAR_region: us-central1
  TF_VAR_zone: us-central1-a
  TF_IN_AUTOMATION: true

jobs:
  build-app:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compile and publish application
        run: |
          echo "Compiling and publishing the worker application"
          dotnet publish app/WorkerDemo.csproj --configuration Release --output publish/WorkerDemo

      - name: Package application
        shell: pwsh
        run: |
          Write-Host "Packaging the published worker application"
          Compress-Archive -Path publish/WorkerDemo/* -DestinationPath worker-demo.zip

      - name: Upload compiled application
        uses: actions/upload-artifact@v4
        with:
          name: worker-demo
          path: worker-demo.zip

  build-image:
    needs: build-app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Set up Packer
        uses: hashicorp/setup-packer@main
        with:
          version: 1.11.2

      - name: Generate demo SSH key pair
        shell: bash
        run: |
          echo "Generating an ephemeral SSH key pair for builder and worker provisioning"
          ssh-keygen -t ed25519 -N "" -C "github-actions-demo" -f "$RUNNER_TEMP/demo-ssh-key"
          chmod 600 "$RUNNER_TEMP/demo-ssh-key"
          echo "SSH_PRIVATE_KEY_FILE=$RUNNER_TEMP/demo-ssh-key" >> "$GITHUB_ENV"
          echo "PKR_VAR_ssh_private_key_file=$RUNNER_TEMP/demo-ssh-key" >> "$GITHUB_ENV"
          echo "PKR_VAR_ssh_public_key=$(cat "$RUNNER_TEMP/demo-ssh-key.pub")" >> "$GITHUB_ENV"
          echo "TF_VAR_worker_ssh_public_key=$(cat "$RUNNER_TEMP/demo-ssh-key.pub")" >> "$GITHUB_ENV"

      - name: Download compiled application
        uses: actions/download-artifact@v4
        with:
          name: worker-demo

      - name: Initialize Terraform
        run: |
          echo "Initializing Terraform with the remote state backend"
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=packer-windows-demo"

      - name: Validate and apply Terraform
        run: |
          echo "Checking Terraform formatting and configuration"
          terraform fmt -check
          terraform validate
          echo "Provisioning the image build infrastructure"
          terraform apply -auto-approve

      - name: Read WinRM password from Secret Manager
        shell: bash
        run: |
          echo "Reading the WinRM password from Secret Manager"
          winrm_password="$(gcloud secrets versions access latest \
            --secret="$(terraform output -raw winrm_secret_id)" \
            --project="$TF_VAR_project_id")"
          echo "::add-mask::$winrm_password"
          echo "PKR_VAR_winrm_password=$winrm_password" >> "$GITHUB_ENV"

      - name: Initialize and validate Packer
        run: |
          echo "Initializing and validating the Packer template"
          export PKR_VAR_project_id="$TF_VAR_project_id"
          export PKR_VAR_zone="$TF_VAR_zone"
          export PKR_VAR_network="$(terraform output -raw build_network)"
          export PKR_VAR_subnetwork="$(terraform output -raw build_subnetwork)"
          export PKR_VAR_builder_service_account="$(terraform output -raw builder_service_account)"
          export PKR_VAR_ssh_public_key="$PKR_VAR_ssh_public_key"
          export PKR_VAR_ssh_private_key_file="$PKR_VAR_ssh_private_key_file"
          packer init .
          packer fmt -check .
          packer validate .

      - name: Build and self-test golden image
        run: |
          echo "Building and self-testing Windows golden images over WinRM and SSH"
          export PKR_VAR_project_id="$TF_VAR_project_id"
          export PKR_VAR_zone="$TF_VAR_zone"
          export PKR_VAR_network="$(terraform output -raw build_network)"
          export PKR_VAR_subnetwork="$(terraform output -raw build_subnetwork)"
          export PKR_VAR_builder_service_account="$(terraform output -raw builder_service_account)"
          export PKR_VAR_ssh_public_key="$PKR_VAR_ssh_public_key"
          export PKR_VAR_ssh_private_key_file="$PKR_VAR_ssh_private_key_file"
          packer build .

      - name: Publish compiled application to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "demo-${{ github.run_id }}"
          name: "Windows worker demo ${{ github.run_id }}"
          prerelease: true
          generate_release_notes: false
          files: worker-demo.zip

      - name: Deploy separate worker VM
        shell: bash
        env:
          RELEASE_URL: "https://github.com/${{ github.repository }}/releases/download/demo-${{ github.run_id }}/worker-demo.zip"
        run: |
          echo "Deploying the separate worker VM from the golden image"
          image_name="$(jq -r '.builds[] | select(.artifact_id | contains("windows-server-2022-ssh-") | not) | .artifact_id' packer-manifest.json | cut -d: -f2)"
          terraform apply -auto-approve \
            -var="golden_image=$image_name" \
            -var="app_release_url=$RELEASE_URL"

      - name: Transfer application to worker over SSH
        shell: bash
        run: |
          echo "Waiting for the worker OpenSSH service"
          for attempt in {1..30}; do
            if gcloud compute ssh "packer@windows-demo-worker" \
              --project="$TF_VAR_project_id" \
              --zone="$TF_VAR_zone" \
              --tunnel-through-iap \
              --ssh-key-file="$SSH_PRIVATE_KEY_FILE" \
              --quiet \
              --command="Write-Output 'SSH is ready'"; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Worker OpenSSH service did not become available"
              exit 1
            fi
            sleep 10
          done
          echo "Copying the worker package to the target server over SSH"
          gcloud compute scp worker-demo.zip \
            "packer@windows-demo-worker:C:/WorkerDemo/worker-demo.zip" \
            --project="$TF_VAR_project_id" \
            --zone="$TF_VAR_zone" \
            --tunnel-through-iap \
            --ssh-key-file="$SSH_PRIVATE_KEY_FILE" \
            --quiet
          echo "Copying the reusable post-install verifier to the target server"
          gcloud compute scp scripts/verify-worker.ps1 \
            "packer@windows-demo-worker:C:/WorkerDemo/verify-worker.ps1" \
            --project="$TF_VAR_project_id" \
            --zone="$TF_VAR_zone" \
            --tunnel-through-iap \
            --ssh-key-file="$SSH_PRIVATE_KEY_FILE" \
            --quiet
          echo "Provisioning and starting the worker application over SSH"
          gcloud compute ssh "packer@windows-demo-worker" \
            --project="$TF_VAR_project_id" \
            --zone="$TF_VAR_zone" \
            --tunnel-through-iap \
            --ssh-key-file="$SSH_PRIVATE_KEY_FILE" \
            --quiet \
            --command="powershell.exe -NoProfile -Command \"Expand-Archive -Path 'C:\\WorkerDemo\\worker-demo.zip' -DestinationPath 'C:\\WorkerDemo' -Force; Start-Service W3SVC; Start-Process -FilePath 'C:\\Program Files\\dotnet\\dotnet.exe' -ArgumentList 'WorkerDemo.dll --urls http://127.0.0.1:8080' -WorkingDirectory 'C:\\WorkerDemo' -WindowStyle Hidden\""

      - name: Run post-install checks on worker over SSH
        shell: bash
        run: |
          echo "Checking IIS, OpenSSH, application files, process state, and local HTTP endpoints"
          gcloud compute ssh "packer@windows-demo-worker" \
            --project="$TF_VAR_project_id" \
            --zone="$TF_VAR_zone" \
            --tunnel-through-iap \
            --ssh-key-file="$SSH_PRIVATE_KEY_FILE" \
            --quiet \
            --command="powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\\WorkerDemo\\verify-worker.ps1 -Port 8080 -InstallDirectory C:\\WorkerDemo -ApplicationName WorkerDemo"

      - name: Verify deployed application
        shell: bash
        run: |
          echo "Checking the worker application through its public endpoint"
          worker_ip="$(terraform output -raw worker_public_ip)"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "http://$worker_ip:8080/health" | jq -e '.status == "healthy"' >/dev/null && \
              curl --fail --silent --show-error "http://$worker_ip:8080/" | jq -e '.application == "Windows Worker Demo" and .status == "healthy"' >/dev/null; then
              echo "PASS: public health and application endpoints are healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Worker application did not become healthy"
          exit 1